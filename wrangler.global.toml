name = "golden-app-global"
main = "src/entry_global.py"
compatibility_date = "2026-07-01"
compatibility_flags = ["python_workers", "disable_python_no_global_handlers"]

[vars]
ENVIRONMENT = "production"
ACCESS_TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
ACCESS_AUD = "replace-with-your-access-application-audience"
CORS_ORIGINS = "https://app.example.com"

[[d1_databases]]
binding = "DB"
database_name = "golden-app"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[env.production.vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "https://app.example.com"
ACCESS_TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
ACCESS_AUD = "replace-with-your-access-application-audience"

[[env.production.d1_databases]]
binding = "DB"
database_name = "golden-app-production"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[python_modules]
exclude = [
  "**/*.pyc",
  "**/__pycache__/**",
  "**/*.dist-info/**",
  "asgi.py",
  "hayate/adapters/asgi.py",
  "hayate/adapters/aws.py",
  "workers/wsgi.py",
]
