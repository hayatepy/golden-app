[project]
name = "golden-app"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "hayate>=0.15.3,<0.16; sys_platform != 'emscripten'",
  # Bypass Pyodide's delayed package-index mirror for release-day verification.
  "hayate @ https://files.pythonhosted.org/packages/55/00/eb7fb5e6fecca27667169dea5e321e04ccafdd763351ab6ac159354ec3d2/hayate-0.15.3-py3-none-any.whl#sha256=2192cf8b3ee40d3dbc34aba8d9a6457256ca6dd3d736c4db1f787b66c963aca5 ; sys_platform == 'emscripten'",
  "hayate-sql>=0.1.2,<0.2",
  "hayate-mcp>=0.12.1,<0.13",
  "hayate-openapi>=0.8.2,<0.9",
  "jinja2==3.1.6",
  "rpds-py>=0.26; sys_platform != 'emscripten'",
]

[dependency-groups]
dev = [
  "pytest>=8.3; sys_platform != 'emscripten'",
  "pytest-asyncio>=0.25; sys_platform != 'emscripten'",
  "ruff>=0.16; sys_platform != 'emscripten'",
  "uvicorn>=0.30; sys_platform != 'emscripten'",
  "workers-py>=1.15,<2; sys_platform != 'emscripten'",
  "workers-runtime-sdk>=1.6,<2; sys_platform != 'emscripten'",
  "playwright>=1.54,<2; sys_platform != 'emscripten'",
]

[tool.uv]
environments = [
  "sys_platform == 'emscripten'",
  "sys_platform != 'emscripten'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "browser: end-to-end smoke tests that require an installed Chromium browser",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/hayate_admin", "src/hayate_htmx"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
