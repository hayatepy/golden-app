[project]
name = "golden-app"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "hayate>=0.16.0,<0.17; sys_platform != 'emscripten'",
  # Bypass Pyodide's delayed package-index mirror for release-day verification.
  "hayate @ https://files.pythonhosted.org/packages/c0/fd/16c515e568e4ae2e978cf6e69400eb8c81b82933a8b4404a6129361f029c/hayate-0.16.0-py3-none-any.whl#sha256=44061c9cdc2d0e5f0350b617a6413dc9eede1ed8314664bffe93d08823cbd527 ; sys_platform == 'emscripten'",
  "hayate-sql>=0.1.2,<0.2",
  "hayate-mcp>=0.12.1,<0.13",
  "hayate-openapi>=0.8.2,<0.9",
  "jinja2==3.1.6",
  "rpds-py>=0.26; sys_platform != 'emscripten'",
]

[dependency-groups]
dev = [
  "pytest>=8.3; sys_platform != 'emscripten'",
  "pytest-asyncio>=0.25; sys_platform != 'emscripten'",
  "ruff>=0.16; sys_platform != 'emscripten'",
  "schemathesis==4.24.3; sys_platform != 'emscripten'",
  "uvicorn>=0.30; sys_platform != 'emscripten'",
  "workers-py>=1.15,<2; sys_platform != 'emscripten'",
  "workers-runtime-sdk>=1.6,<2; sys_platform != 'emscripten'",
  "playwright>=1.54,<2; sys_platform != 'emscripten'",
]

[tool.uv]
environments = [
  "sys_platform == 'emscripten'",
  "sys_platform != 'emscripten'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "browser: end-to-end smoke tests that require an installed Chromium browser",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/hayate_admin", "src/hayate_htmx"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
